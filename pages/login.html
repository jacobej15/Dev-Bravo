<body>

    <div class="login-card">

        <h1>UNA</h1>
        <h2>University of North Alabama</h2>

        <p>Student Sign In</p>

        <form id="signin-form">

            <label for="hello-box">Username</label>
            <input
                type="text"
                id="hello-box"
                placeholder="Username"
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                placeholder="Password"
            >

            <button id="hello-btn" type="submit">
                Sign In
            </button>

        </form>

        <p id="user-greeting"></p>

        <a href="index.html">← Back to Home</a>

    </div>

    <script src="../scripts/app.js"></script>

</body>
